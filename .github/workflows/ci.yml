name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  live-endpoint-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sanity-check label mapping on live endpoint
        run: |
          check() {
            for attempt in 1 2 3 4 5; do
              RESULT=$(aws sagemaker-runtime invoke-endpoint \
                --endpoint-name finbert-nse-sentiment-serverless \
                --content-type application/json \
                --body "$(echo "{\"inputs\": \"$1\"}" | base64)" \
                --cli-binary-format raw-in-base64-out \
                /dev/stdout --no-cli-pager 2>/dev/null | tail -1)
              if echo "$RESULT" | grep -q "\"label\":\"$2\""; then
                echo "Input: $1 -> $RESULT (attempt $attempt)"
                return 0
              fi
              echo "Attempt $attempt: not ready yet or mismatch, retrying in 15s..."
              sleep 15
            done
            echo "FAILED after 5 attempts: expected $2, got $RESULT"
            exit 1
          }
          check "Company profits surged and stock price hit an all-time high" "positive"
          check "Company reports massive losses and files for bankruptcy" "negative"
          check "The company will hold its annual shareholder meeting next Tuesday" "neutral""